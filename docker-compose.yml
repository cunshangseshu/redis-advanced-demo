services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-advanced-learning
    ports:
      - "6380:6379"
    volumes:
      - ./redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped